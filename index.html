<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pendlingskartan</title>
<meta name="description" content="Hur Sverige pendlar till jobbet, kommun för kommun 2004–2024, och var tågen går. Ett personligt projekt av Lukas Posolda.">
<meta name="author" content="Lukas Posolda">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23A9B795'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;600&display=swap">
<style>
/* Layout: control panel left, map or analysis in the middle, municipality card top right. Identity: Fieldnote. */
:root{
  --bg:#F3F4F1; --panel:#FFFFFF; --fg:#1B2422; --muted:#56625F; --rule:#D6DAD5; --chip:#F3F4F1;
  --sea:#F3F4F1; --land:#FFFFFF; --land-stroke:#D6DAD5; --mesh:#1B2422;
  --out:#23605F; --in:#C08A1E; --accent:#23605F; --on-accent:#FFFFFF; --hi:#C08A1E; --lichen:#A9B795; --contour:#9DB5B1;
  --link:#56625F; --halo:#FFFFFF; --bubble:#1B2422; --sel:#1B2422; --track:#56625F;
  --c-fast:#C08A1E; --c-long:#5D7A8C; --c-reg:#23605F; --c-none:#D6DAD5;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --fs:15px; --fs-s:13px; --fs-xs:11.5px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13201F; --panel:#1A2928; --fg:#E4EAE7; --muted:#A3B0AC; --rule:#2C3B39; --chip:#2C3B39;
  --sea:#13201F; --land:#1A2928; --land-stroke:#2C3B39; --mesh:#E4EAE7;
  --out:#5FA3A0; --in:#D9A53A; --accent:#6FB3AF; --on-accent:#13201F; --hi:#D9A53A; --contour:#2F4F4C;
  --link:#A3B0AC; --halo:#1A2928; --bubble:#E4EAE7; --sel:#E4EAE7; --track:#A3B0AC;
  --c-fast:#D9A53A; --c-long:#8FA9B8; --c-reg:#5FA3A0; --c-none:#56625F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13201F; --panel:#1A2928; --fg:#E4EAE7; --muted:#A3B0AC; --rule:#2C3B39; --chip:#2C3B39;
  --sea:#13201F; --land:#1A2928; --land-stroke:#2C3B39; --mesh:#E4EAE7;
  --out:#5FA3A0; --in:#D9A53A; --accent:#6FB3AF; --on-accent:#13201F; --hi:#D9A53A; --contour:#2F4F4C;
  --link:#A3B0AC; --halo:#1A2928; --bubble:#E4EAE7; --sel:#E4EAE7; --track:#A3B0AC;
  --c-fast:#D9A53A; --c-long:#8FA9B8; --c-reg:#5FA3A0; --c-none:#56625F; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 var(--fs)/1.4 var(--font);margin:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
.wordmark{display:inline-flex;align-items:center;gap:.6em;font:600 12px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--fg);text-decoration:none;padding-top:6px}
.wordmark::before{content:"";width:.9em;height:.9em;border-radius:999px;background:var(--lichen);flex:none}
a{color:var(--accent);text-underline-offset:4px;text-decoration-thickness:1px}

.app{display:grid;grid-template-columns:330px minmax(0,1fr);height:100%}
aside{background:var(--panel);border-right:1px solid var(--rule);overflow-y:auto;padding-block:20px 16px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lang{display:flex;border:1px solid var(--fg)}
.lang button{border:0;background:transparent;padding:3px 9px;font-size:var(--fs-xs);font-weight:600;cursor:pointer;letter-spacing:.06em}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--panel)}
h1{font-weight:300;font-size:32px;line-height:1.05;letter-spacing:-.025em;margin:0;text-wrap:balance}
h1 small{font-size:13px;font-weight:600;letter-spacing:.09em;vertical-align:top;margin-left:6px;background:var(--accent);color:var(--on-accent);padding:1px 5px}
.lead{margin:8px 0 0;font-size:var(--fs);line-height:1.45}
.sec{display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--fg);padding-top:10px}
.lab{font-size:var(--fs-xs);font-weight:600;letter-spacing:.09em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lab output{font-variant-numeric:tabular-nums;letter-spacing:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--fg)}
.seg button{border:0;border-left:1px solid var(--fg);background:transparent;padding:6px 3px;font-size:var(--fs-s);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--panel);font-weight:600}
.seg button:hover:not([aria-pressed="true"]){background:var(--chip)}
.seg.modes{grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}
.seg.modes button{border-left:1px solid var(--fg);border-top:1px solid var(--fg)}
.seg.modes button:nth-child(3n+1){border-left:0}
.seg.modes button:nth-child(-n+3){border-top:0}
.viewtog{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--fg)}
.viewtog button{border:0;padding:9px 6px;background:transparent;cursor:pointer;font-weight:600;font-size:var(--fs-s);letter-spacing:.04em}
.viewtog button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.year{display:flex;align-items:center;gap:12px}
.year .big{font-size:40px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;min-width:96px}
.play{width:34px;height:34px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;flex:none;display:grid;place-items:center}
.note{font-size:var(--fs-xs);line-height:1.35}
.row{display:flex;gap:10px;align-items:center;font-size:var(--fs-s)}
.row label{display:flex;gap:6px;align-items:center;cursor:pointer}
select,.search{width:100%;padding:6px 8px;border:1px solid var(--fg);background:var(--panel);font-size:var(--fs-s)}
.legend{display:flex;flex-direction:column;gap:5px;font-size:var(--fs-s)}
.legend .k{display:flex;gap:8px;align-items:center}
.sw{width:22px;height:0;border-top:3px solid;flex:none}
.box{width:14px;height:12px;flex:none}
.ramp{height:10px;border:1px solid var(--rule)}
.ticks{display:flex;justify-content:space-between;font-size:var(--fs-xs);font-variant-numeric:tabular-nums}
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px}
.steps div{font-size:10px;text-align:center;font-variant-numeric:tabular-nums}
.steps span{display:block;height:12px;margin-bottom:2px}
.foot{margin-top:auto;font-size:var(--fs-xs);line-height:1.4;border-top:1px solid var(--fg);padding-top:8px}
.linkbtn{color:var(--accent);text-decoration:underline;background:none;border:0;padding:0;cursor:pointer;font-size:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mapwrap{position:relative;min-width:0;background:var(--sea);overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none}
.kom{stroke:var(--land-stroke);stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer}
.kom:hover{stroke:var(--sel);stroke-width:1.4}
.mesh{fill:none;stroke:var(--mesh);stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
/* county border: dash-dot, the cartographic convention for administrative borders */
.lanb{fill:none;stroke:var(--fg);stroke-opacity:.75;stroke-width:1.1;stroke-dasharray:7 3 1.5 3;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
/* railway: thin line with cross ties, the cartographic convention for railways */
.ties{fill:none;stroke:var(--track);stroke-width:5;stroke-dasharray:1 7;stroke-opacity:.8;vector-effect:non-scaling-stroke;pointer-events:none}
.sym{flex:none;display:block}
.lead a,.lead button{white-space:nowrap}
.track{fill:none;stroke:var(--track);stroke-width:1.1;stroke-opacity:.8;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
.seg-l{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;pointer-events:none}
.flow{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;pointer-events:none}
.rlink{stroke:var(--link);stroke-width:.8;vector-effect:non-scaling-stroke;opacity:.7;pointer-events:none}
.bub{stroke:var(--halo);stroke-width:.8;vector-effect:non-scaling-stroke;pointer-events:none}
.stn{fill:var(--panel);stroke:var(--fg);stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer}
.stn.on{fill:var(--hi)}
.selo{fill:none;stroke:var(--sel);stroke-width:2.6;vector-effect:non-scaling-stroke;pointer-events:none}
.lbl{font-size:12px;font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--halo);stroke-width:3.2px;stroke-linejoin:round;pointer-events:none}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--fg);padding:7px 10px;font-size:var(--fs-s);line-height:1.35;max-width:270px;z-index:7}
.tip b{font-weight:600}
.zoom{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;border:1px solid var(--fg);background:var(--panel)}
.zoom button{width:34px;height:34px;border:0;background:transparent;font-size:18px;cursor:pointer}
.zoom button+button{border-top:1px solid var(--fg)}
.mapnote{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:14px;font-size:var(--fs-xs);background:var(--panel);border:1px solid var(--fg);padding:6px 9px;max-width:300px}

.card{position:absolute;top:14px;right:calc(14px + env(safe-area-inset-right,0px));width:350px;max-height:calc(100% - 28px);overflow-y:auto;background:var(--panel);border:1px solid var(--fg);padding:16px;display:flex;flex-direction:column;gap:12px;z-index:4}
.card h2{margin:0;font-size:24px;font-weight:300;line-height:1.1}
.chead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:2px 6px;margin-top:6px}
.badge.core{background:var(--accent);color:var(--on-accent)}
.badge.mem{border:1px solid var(--fg)}
.x{border:1px solid var(--fg);background:transparent;width:28px;height:28px;cursor:pointer;flex:none}
.big3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--fg)}
.big3>div{padding:8px;border-left:1px solid var(--fg);min-width:0}
.big3>div:first-child{border-left:0}
.big3 .v{font-size:23px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.1}
.l{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;line-height:1.25}
.big3 .l{margin-top:3px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid3 .v{font-variant-numeric:tabular-nums;font-size:var(--fs)}
.spark{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spark svg{width:100%;height:42px;display:block}
.toplist{display:flex;flex-direction:column;gap:6px}
.toplist button{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto auto;gap:2px 8px;font-size:var(--fs-s);align-items:baseline}
.toplist button:focus-visible{outline:2px solid var(--accent)}
.toplist .n{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;min-width:0}
.toplist button:hover .n{text-decoration-color:var(--fg)}
.toplist .num{font-variant-numeric:tabular-nums;font-size:var(--fs-xs)}
.toplist .bar{grid-column:1/-1;height:3px}
.tchip{font-size:10px;font-weight:600;font-variant-numeric:tabular-nums;padding:1px 5px;border:1px solid var(--fg);white-space:nowrap}
.tchip.ok{background:var(--hi);color:#1B2422;border-color:var(--hi)}
.railbox{border:1px solid var(--fg);padding:10px;display:flex;flex-direction:column;gap:8px}
.stlist{display:flex;flex-direction:column;gap:3px;font-size:var(--fs-s)}
.stlist div{display:flex;justify-content:space-between;gap:8px}
.stlist span:last-child{font-variant-numeric:tabular-nums}
.empty{font-size:var(--fs-s);font-style:italic}

/* analysvy */
.dash{position:absolute;inset:0;overflow-y:auto;background:var(--bg);z-index:5;padding-block:24px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.dash .in{max-width:1180px;display:flex;flex-direction:column;gap:22px}
.dash h2{font-weight:300;font-size:36px;line-height:1.05;margin:0;text-wrap:balance}
.dash .sub{color:var(--muted);max-width:70ch;margin:6px 0 0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--fg);background:var(--panel)}
.kpis>div{padding:14px 16px;border-left:1px solid var(--fg);min-width:0}
.kpis>div:first-child{border-left:0}
.kpis .v{font-size:clamp(24px,2.6vw,36px);white-space:nowrap;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.kpis .d{font-size:var(--fs-s);margin-top:6px;line-height:1.3}
.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.pan{background:var(--panel);border:1px solid var(--rule);border-top:2px solid var(--fg);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pan.wide{grid-column:1/-1}
.pan h3{margin:0;font-size:18px;font-weight:600;line-height:1.2}
.pan p{margin:0;font-size:var(--fs-s);max-width:80ch}
.pan svg{display:block;width:100%;height:auto}
.pan .axis text{fill:var(--fg);font-size:11px;font-family:var(--font)}
.pan .axis line,.pan .axis path{stroke:var(--rule)}
.pan .grid line{stroke:var(--rule);stroke-dasharray:2 3}
.pan .vl{fill:var(--fg);font-size:11px;font-variant-numeric:tabular-nums;font-family:var(--font)}
.pan .nl{fill:var(--fg);font-size:11.5px;font-family:var(--font)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:var(--fs-s)}
th{text-align:left;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--fg);padding:6px 8px 6px 0}
td{border-bottom:1px solid var(--rule);padding:6px 8px 6px 0;font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--chip)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--fs-s)}
.src{display:inline-block;vertical-align:middle;font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:2px 6px;margin-left:4px;line-height:1.3;white-space:nowrap}
.src-scb{border:1px solid var(--fg);color:var(--fg)}
.src-tt{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:2px}
.src-both{border:1px dashed var(--fg);color:var(--fg)}
.readme{background:var(--panel);border:1px solid var(--rule);border-top:2px solid var(--fg);padding:16px}
.readme-h{font-size:var(--fs);font-weight:600;margin-bottom:10px}
.readme-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.ri{display:flex;flex-direction:column;gap:5px}
.ri .src{margin-left:0}
.ri p{margin:0;font-size:var(--fs-s);line-height:1.4}
.dsec{margin-top:10px;border-top:1px solid var(--fg);padding-top:14px}
.dsec-h{display:flex;gap:14px;align-items:flex-start}
.dnum{font-size:36px;font-weight:400;color:var(--accent);line-height:.9;font-variant-numeric:tabular-nums}
.dsec h3{margin:0;font-size:22px;font-weight:400;line-height:1.2}
.dsec p{margin:4px 0 0;font-size:var(--fs-s);font-style:italic}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.k1x{grid-template-columns:minmax(0,1fr)}
.kpis.k1x>div{display:flex;gap:18px;align-items:center}
.kpis.k1x .d{margin-top:0;font-size:var(--fs);max-width:60ch}
.kn{font-size:var(--fs-s);color:var(--muted);margin-top:4px}
.lg span{display:inline-flex;gap:6px;align-items:center}

.about{position:absolute;inset:0;background:var(--panel);overflow-y:auto;z-index:6;padding-block:28px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.about .in{max-width:76ch;display:flex;flex-direction:column;gap:12px}
.about h2{font-weight:300;font-size:30px;margin:0}
.about h3{font-weight:600;font-size:var(--fs);margin:10px 0 0}
.about p,.about li{margin:0;line-height:1.45}
.about code{font-size:var(--fs-s)}

@media (max-width:1000px){ .readme-g{grid-template-columns:minmax(0,1fr)} .kpis.k3{grid-template-columns:minmax(0,1fr)} .kpis.k3>div{border-left:0} .kpis.k3>div+div{border-top:1px solid var(--fg)} .kpis.k1x>div{flex-direction:column;align-items:flex-start;gap:6px} .panels{grid-template-columns:minmax(0,1fr)} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .kpis>div:nth-child(3){border-left:0} .kpis>div:nth-child(n+3){border-top:1px solid var(--fg)} }
@media (max-width:820px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto}
  aside{border-right:0;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
  .mapwrap{height:78vh;order:-1}
  .card{position:static;width:auto;max-height:none;border-left:0;border-right:0}
  .foot{margin-top:0}
  .about,.dash{position:fixed}
  .dash{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .kpis .v{font-size:30px}
  .mapnote{display:none}
}
.lab,.l,th,.src,.badge,.tchip,.lang button,.readme-h,.eyebrow{font-family:var(--mono);font-weight:500}
.lab,.eyebrow{color:var(--accent)}
.v,.big,output,.ticks,.steps div,td.r,.toplist .num,.kpis .v,.dnum,.year .big,.figure{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pan .vl,.pan .axis text{font-family:var(--mono)}
.d,.note,.pan p{color:var(--muted)}
.play{border-radius:2px}
.viewtog,.seg,select,.search,.lang{border-radius:2px;overflow:hidden}
/* about */
.ah{position:relative;padding:8px 0 24px;border-bottom:2px solid var(--fg);margin-bottom:8px;overflow:hidden}
.ah canvas{position:absolute;right:-20px;top:0;width:250px;height:100%;pointer-events:none}
.ah>*:not(canvas){position:relative}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.about h2{font-weight:300;font-size:40px;line-height:1.1;letter-spacing:-.025em;margin:6px 0 10px}
.about .lead2{font-size:18px;line-height:1.6;max-width:38ch}
.about h3{font-weight:600;font-size:20px;margin:22px 0 2px}
.about dl{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:8px 18px;margin:6px 0 0}
.about dt{font-weight:600}
.about dd{margin:0}
.about table{font-size:var(--fs-s)}
.about td{vertical-align:top;padding-right:14px}
.about .cite{font-family:var(--mono);font-size:12.5px;border-left:2px solid var(--rule);padding:6px 12px;line-height:1.6}
.about .meta{font-family:var(--mono);font-size:12px;color:var(--muted);max-width:44ch}
@media (max-width:900px){.ah canvas{display:none}.about .lead2{max-width:none}}
@media (max-width:640px){.about dl{grid-template-columns:minmax(0,1fr)}.about dd{margin-bottom:8px}.ah canvas{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="top">
      <a class="wordmark" href="https://github.com/lukasposolda-qwertz" rel="author">Lukas Posolda</a>
      <div class="lang" role="group" aria-label="Språk / Language"><button id="lang-sv" aria-pressed="true">SV</button><button id="lang-en" aria-pressed="false">EN</button></div>
    </div>
    <div>
      <h1><span data-t="title"></span></h1>
      <p class="lead"><span data-t="lead"></span> <button class="linkbtn" id="lead-more" data-t="about_more"></button></p>

 sv:`<div class="ah"><canvas id="contour" aria-hidden="true"></canvas>
  <div class="eyebrow">Om kartan</div>
  <h2>Pendlingskartan</h2>
  <p class="lead2">Var bor folk, och var jobbar de? Kartan visar hur många som pendlar mellan Sveriges 290 kommuner, år för år sedan 2004, och var tågen går i dag. Det är ett personligt projekt som bygger helt på öppna data.</p>
  <p class="meta">Senast uppdaterad 2026-11-08 · pendling 2004–2024 · tidtabell ${DAYSTR}</p></div>

 <h3 id="om-vad">Vad kartan visar</h3>
 <p><strong>Kartan visar i första hand pendlingsregioner.</strong> En pendlingsregion är en grupp kommuner som hänger ihop genom att många pendlar mellan dem. Det är alltså inte län eller andra administrativa indelningar. Regionerna räknas fram ur SCB:s pendlingsdata för det år du väljer, och gränserna följer var folk bor och jobbar.</p>
 <p>Så läser du färgerna:</p>
 <ul>
  <li><strong>Varje färgad yta är en pendlingsregion.</strong> Den samlas kring en kärna, oftast en större stad, dit många från de omgivande kommunerna pendlar. Exempel: Östersund med Krokom, Bräcke, Berg, Ragunda och Åre.</li>
  <li><strong>En kommun ingår i en region</strong> när minst 10 procent av de sysselsatta som bor där arbetar i samma kommun. Du kan ändra gränsen med reglaget Tröskel.</li>
  <li><strong>Vita kommuner</strong> når inte gränsen mot någon annan kommun. De flesta som bor där jobbar i hemkommunen, eller så sprids pendlingen åt flera håll.</li>
  <li><strong>Färgen betyder inget i sig.</strong> Den skiljer bara grannregioner åt. Samma färg på två ställen betyder inte att regionerna hör ihop.</li>
  <li><strong>Streckprickade linjer</strong> är länsgränser, så att du kan jämföra pendlingsregionerna med den administrativa indelningen.</li>
 </ul>
 <p>Ovanpå regionerna kan du lägga <strong>tågtrafiken</strong>: vilka tåg som går och hur lång tid resan tar mellan kommunerna, enligt tidtabellen en vanlig tisdag. Pendlingen och tågen kommer från två olika källor. Pendlingen räknar alla, oavsett om de åker bil, buss, tåg, cykel eller jobbar hemifrån. När källorna läggs bredvid varandra syns var det finns ett snabbt tåg där många pendlar, och var det saknas. Kartan visar däremot inte hur många som faktiskt åker tåg. Den uppgiften finns i resvaneundersökningar och i operatörernas resandestatistik.</p>

 <h3>Definitioner</h3>
 <dl>
  <dt>Sysselsatt</dt><dd>En person som förvärvsarbetade i november det aktuella året, enligt SCB:s register. Från 2020 räknas personer 15–74 år, före 2020 personer från 16 år.</dd>
  <dt>Bostadskommun</dt><dd>Kommunen där personen är folkbokförd.</dd>
  <dt>Arbetsplatskommun</dt><dd>Kommunen där personens arbetsplats är registrerad. Den kan skilja sig från platsen personen faktiskt åker till, till exempel vid distansarbete eller när arbetsplatsen är registrerad på ett huvudkontor.</dd>
  <dt>Pendlare</dt><dd>En sysselsatt som har sin arbetsplats i en annan kommun än bostadskommunen. Utpendlare räknas från bostadskommunen, inpendlare till arbetsplatskommunen.</dd>
  <dt>Pendlingsflöde</dt><dd>Antalet pendlare från en kommun till en annan. Kartan ritar flöden med minst 10 personer.</dd>
  <dt>Nettopendling</dt><dd>Inpendlare minus utpendlare. Positivt värde betyder fler jobb än sysselsatta boende.</dd>
  <dt>Pendlingsandel</dt><dd>Pendlare från kommun A till kommun B delat med alla sysselsatta som bor i A.</dd>
  <dt>Pendlingsregion</dt><dd>En grupp kommuner som hänger ihop genom pendling. En kommun hör till regionen dit flest av dess utpendlare åker, om andelen når tröskeln.</dd>
  <dt>Tröskel</dt><dd>Den pendlingsandel som krävs för att en kommun ska räknas till en annan kommuns region. Standard är 10 procent.</dd>
  <dt>Kärna</dt><dd>Kommunen som en region är samlad kring. Om två kommuner pekar mot varandra blir den med flest arbetstillfällen kärnan.</dd>
  <dt>Fristående kommun</dt><dd>En kommun där ingen enskild destination når tröskeln och som inte själv är kärna.</dd>
  <dt>Tågförbindelse</dt><dd>Den snabbaste tågresan från en station i ena kommunen till en station i den andra, med avgång 06–09 en vanlig tisdag. Byten och väntetid ingår, resan till och från stationen ingår inte.</dd>
  <dt>Direkttåg</dt><dd>Ett tåg som stannar i båda kommunerna utan byte.</dd>
  <dt>Tågslag</dt><dd>Snabbtåg, fjärr- och interregionala tåg samt regional- och pendeltåg, enligt trafikslaget i tidtabellen. Tunnelbana och spårväg ingår inte.</dd>
 </dl>

 <h3>Så har jag räknat</h3>
 <p><strong>Pendlingsregioner.</strong> För varje kommun tar jag den kommun dit flest utpendlare åker. Om andelen når tröskeln hör kommunen till den kommunens region. <em>Slå ihop kärnor i kedjor</em> följer kedjan uppåt, så att större regioner växer fram.</p>
 <p><strong>Restid med tåg.</strong> Jag söker i tidtabellen med en så kallad connection scan. Sökningen startar var 15:e minut mellan 06.00 och 08.45 från alla stationer i startkommunen och sparar den snabbaste resan till varje annan kommun. Byten kräver minst 3 minuter. Resor som tar mer än tre timmar räknas som att tågförbindelse saknas.</p>
 <p><strong>Stationer</strong> kopplas till den kommun de ligger i. Stationer som heter som en närliggande kommun, till exempel Sundbyberg, kopplas till den kommunen.</p>

  <li>Kommungränserna är förenklade och passar för översikt, inte för exakta mätningar.</li>

 en:`<div class="ah"><canvas id="contour" aria-hidden="true"></canvas>
  <div class="eyebrow">About the map</div>
  <h2>Sweden commute map</h2>
  <p class="lead2">Where do people live, and where do they work? The map shows how many people commute between Sweden's 290 municipalities, year by year since 2004, and where the trains run today. It is a personal project built entirely on open data.</p>
  <p class="meta">Last updated 2026-11-08 · commuting 2004–2024 · timetable ${DAYSTR}</p></div>

 <h3 id="om-vad">What the map shows</h3>
 <p><strong>First of all, the map shows commuting regions.</strong> A commuting region is a group of municipalities tied together because many people commute between them. They are not counties or any other administrative division. The regions are derived from Statistics Sweden's commuting data for the year you pick, and their borders follow where people live and work.</p>
 <p>How to read the colours:</p>
 <ul>
  <li><strong>Each coloured area is a commuting region.</strong> It gathers around a core, usually a larger town, that many people from the surrounding municipalities commute to. Example: Östersund with Krokom, Bräcke, Berg, Ragunda and Åre.</li>
  <li><strong>A municipality joins a region</strong> when at least 10 percent of the employed people living there work in the same municipality. You can change that limit with the Threshold slider.</li>
  <li><strong>White municipalities</strong> do not reach the limit towards any other municipality. Most residents work in their home municipality, or commuting spreads in several directions.</li>
  <li><strong>The colour has no meaning of its own.</strong> It only tells neighbouring regions apart. The same colour in two places does not mean the regions belong together.</li>
  <li><strong>Dash-dot lines</strong> are county borders, so you can compare the commuting regions with the administrative division.</li>
 </ul>
 <p>On top of the regions you can add <strong>rail traffic</strong>: which trains run and how long the trip takes between municipalities, according to the timetable on a regular Tuesday. Commuting and trains come from two separate sources. Commuting counts everyone, whether they go by car, bus, train, bike or work from home. Side by side, they show where there is a fast train where many people commute, and where there is not. The map does not show how many people actually take the train. That figure comes from travel surveys and operators' ridership data.</p>

 <h3>Definitions</h3>
 <dl>
  <dt>Employed</dt><dd>A person in gainful employment in November of the given year, according to Statistics Sweden's registers. From 2020 people aged 15–74 are counted, before 2020 people aged 16 and over.</dd>
  <dt>Home municipality</dt><dd>The municipality where the person is registered as living.</dd>
  <dt>Work municipality</dt><dd>The municipality where the person's workplace is registered. It can differ from where the person actually goes, for example with remote work or when the workplace is registered at a head office.</dd>
  <dt>Commuter</dt><dd>An employed person whose workplace is in another municipality than their home. Out-commuters are counted from the home municipality, in-commuters to the work municipality.</dd>
  <dt>Commuter flow</dt><dd>The number of commuters from one municipality to another. The map draws flows of at least 10 people.</dd>
  <dt>Net commuting</dt><dd>In-commuters minus out-commuters. A positive value means more jobs than employed residents.</dd>
  <dt>Commuting share</dt><dd>Commuters from municipality A to municipality B divided by all employed people living in A.</dd>
  <dt>Commuting region</dt><dd>A group of municipalities tied together by commuting. A municipality joins the region its largest group of out-commuters goes to, if the share reaches the threshold.</dd>
  <dt>Threshold</dt><dd>The commuting share needed for a municipality to join another municipality's region. The default is 10 percent.</dd>
  <dt>Core</dt><dd>The municipality a region gathers around. If two municipalities point at each other, the one with more jobs becomes the core.</dd>
  <dt>Independent municipality</dt><dd>A municipality where no single destination reaches the threshold and which is not a core itself.</dd>
  <dt>Rail connection</dt><dd>The fastest train journey from a station in one municipality to a station in the other, departing 06–09 on a regular Tuesday. Transfers and waiting are included, the trip to and from the station is not.</dd>
  <dt>Direct train</dt><dd>A train that stops in both municipalities without a transfer.</dd>
  <dt>Train type</dt><dd>High-speed, long-distance and inter-regional, and regional and commuter trains, as classified in the timetable. Metro and tram are excluded.</dd>
 </dl>

 <h3>How I calculated</h3>
 <p><strong>Commuting regions.</strong> For each municipality I take the municipality most of its out-commuters go to. If the share reaches the threshold, the municipality joins that region. <em>Merge chained cores</em> follows the chain upwards so that larger regions appear.</p>
 <p><strong>Train time.</strong> I search the timetable with a connection scan. The search starts every 15 minutes between 06:00 and 08:45 from all stations in the start municipality and keeps the fastest journey to every other municipality. Transfers need at least 3 minutes. Journeys longer than three hours count as no rail connection.</p>
 <p><strong>Stations</strong> are linked to the municipality they lie in. Stations named after a neighbouring municipality, such as Sundbyberg, are linked to that municipality.</p>

 <h3>Caveats</h3>
 <ul>
  <li>Statistics Sweden changed its basis twice: in 2019 (new data source in RAMS) and in 2020 (BAS replaces RAMS). Do not compare years straight across those breaks.</li>
  <li>Commuting is for the selected year, trains for the autumn 2026 timetable. The comparison is fairest for recent years.</li>
  <li>Train time is counted from station to station. People who live far from the station have a longer trip.</li>
  <li>Without metro and tram, municipalities such as Nacka and Lidingö appear to have no train to Stockholm.</li>
  <li>Municipal boundaries are simplified and suit an overview, not exact measurement.</li>
 </ul>

 <h3>Sources and licences</h3>
 <div class="tblwrap"><table><thead><tr><th>Data</th><th>Source</th><th>Licence</th></tr></thead><tbody>
  <tr><td>Commuting 2004–2018</td><td>Statistics Sweden, table TAB333 (RAMS)</td><td>CC0 1.0</td></tr>
  <tr><td>Commuting 2019</td><td>Statistics Sweden, table TAB5850 (RAMS)</td><td>CC0 1.0</td></tr>
  <tr><td>Commuting 2020–2024</td><td>Statistics Sweden, table TAB1830 (BAS)</td><td>CC0 1.0</td></tr>
  <tr><td>Timetable</td><td>GTFS Sverige 2 from Trafiklab (Samtrafiken), downloaded via the Mobility Database</td><td>CC0 1.0</td></tr>
  <tr><td>Rail network</td><td>© OpenStreetMap contributors</td><td>ODbL 1.0</td></tr>
  <tr><td>Municipal boundaries</td><td>okfse/sweden-geojson, based on Swedish Election Authority data</td><td>free to reuse</td></tr>
  <tr><td>Map libraries</td><td>D3 and TopoJSON client</td><td>ISC</td></tr>
  <tr><td>Typefaces</td><td>IBM Plex Sans and IBM Plex Mono</td><td>SIL OFL 1.1</td></tr>
 </tbody></table></div>
 <p>The figures are my own processing of the sources' data. They are not official statistics, and the project has no partnership with Statistics Sweden, Trafiklab or any other organisation.</p>

 <h3>Licence for this site</h3>
 <ul>
  <li><strong>Source code:</strong> MIT licence.</li>
  <li><strong>Processed data</strong> (commuting matrices, train times, stations): CC BY 4.0. Credit “Lukas Posolda, Pendlingskartan”.</li>
  <li><strong>The rail network</strong> is derived from OpenStreetMap and falls under the ODbL. Credit “© OpenStreetMap contributors”.</li>
 </ul>

 <h3>Creator</h3>
 <p>The map is made by <a href="https://github.com/lukasposolda-qwertz" rel="author">Lukas Posolda</a>. It is an independent, private project. Code, data and scripts are on <a href="https://github.com/lukasposolda-qwertz/pendlingskartan">GitHub</a>. Found an error? Please open an issue there.</p>
 <h3>How to cite</h3>
 <p class="cite">Posolda, L. (2026). Pendlingskartan: commuting and rail in Sweden's municipalities. https://lukasposolda-qwertz.github.io/pendlingskartan/</p>

};

// ---------- state ----------
const S = {lang:"sv", view:"map", mode:"dus", year:2024, thr:0.10, cons:false, links:true, ind:"self", tracks:true, lanb:true,
  rc:{reg:true,fast:true,long:true}, fitm:60,

if (!/^(sv|nb|nn|no|da)\b/i.test(navigator.language||"sv")) S.lang = "en";
try { const q = new URLSearchParams(location.search).get("lang"); if (q === "en" || q === "sv") S.lang = q; else { const l = localStorage.getItem("pendla-lang"); if (l === "en" || l === "sv") S.lang = l; } } catch(e) {}
const t = k => T[S.lang][k] ?? k;

const fmt = v => Math.round(v).toLocaleString(loc());

const STHLM = P.names.indexOf("Stockholm"), GBG = P.names.indexOf("Göteborg"), MALMO = P.names.indexOf("Malmö");

// ---------- rail data ----------
const TT = Uint8Array.from(atob(RL.tt), c=>c.charCodeAt(0));
const tt = (a,b) => TT[a*N+b];               // 255 = no train within window
const tmin = v => v===255 ? "–" : v+" "+t("min");
const DIR = new Map(); for (let k=0;k<RL.dir.length;k+=3){ const a=RL.dir[k], b=RL.dir[k+1], key=Math.min(a,b)*N+Math.max(a,b); DIR.set(key,(DIR.get(key)||0)+RL.dir[k+2]); }
const direct = (a,b) => DIR.get(Math.min(a,b)*N+Math.max(a,b)) || 0;
const ST = RL.st.map(s=>({name:s[0], lon:s[1], lat:s[2], k:s[3], dep:s[4], tot:s[4][0]+s[4][1]+s[4][2], peak:s[5], ops:s[6]}));

const cache = {};
function Y(y){

// ---------- DUS ----------
// region fills: the four Fieldnote series, full and as a 45 % tint
const tint = (c,bg,k) => d3.interpolateRgb(bg,c)(k);
const SER_L = ["#23605F","#C08A1E","#A9B795","#5D7A8C"], SER_D = ["#5FA3A0","#D9A53A","#A9B795","#8FA9B8"];

function dus(){
  const D = Y(S.year), parent = new Int16Array(N).fill(-1);

  const kids = new Int16Array(N); for (let i=0;i<N;i++) if (parent[i]>=0) kids[parent[i]]++;
  const region = new Int16Array(N);
  for (let i=0;i<N;i++){
    if (S.cons){ let r=i,g=0; while(parent[r]>=0 && g++<300) r=parent[r]; region[i]=r; }
    else region[i] = kids[i] ? i : (parent[i]>=0 ? parent[i] : i);
  }
  const size = new Int16Array(N); for (let i=0;i<N;i++) size[region[i]]++;
  const ids = []; for (let i=0;i<N;i++) if (size[i]>1 && region[i]===i) ids.push(i);

}

// ---------- indicators ----------
const SEQ = d3.quantize(d3.piecewise(d3.interpolateRgb, ["#FFFFFF","#A9B795","#23605F","#1B2422"]), 6);
const DIV = d3.quantize(d3.piecewise(d3.interpolateRgb, ["#C08A1E","#FFFFFF","#23605F"]), 9);
const TIMEB = [30,45,60,90,120,180];
const TIMEC = d3.quantize(d3.piecewise(d3.interpolateRgb, ["#23605F","#A9B795","#D6DAD5"]), 6);
const timeColor = v => { if (v===255) return null; for (let k=0;k<TIMEB.length;k++) if (v<=TIMEB[k]) return TIMEC[k]; return TIMEC.at(-1); };
const IND = {
  self:{f:(D,i)=>D.s[i]/D.w[i], dom:[0.3,0.95], ramp:SEQ, fmt:pct},
  out:{f:(D,i)=>(D.w[i]-D.s[i])/D.w[i], dom:[0.05,0.7], ramp:SEQ, fmt:pct},
  inshare:{f:(D,i)=>(D.j[i]-D.s[i])/D.j[i], dom:[0.05,0.7], ramp:SEQ, fmt:pct},
  ratio:{f:(D,i)=>100*D.j[i]/D.w[i], dom:[40,100,160], ramp:DIV, fmt:v=>fmt(v)},
  net:{f:(D,i)=>D.j[i]-D.w[i], dom:[-20000,0,20000], ramp:DIV, fmt:sgn, sym:true},
  dep:{f:(D,i)=>kDep[i], dom:[0,800], ramp:SEQ, fmt:v=>fmt(v), log:true},
  reach:{f:(D,i)=>D.reachO[i], dom:[0,0.8], ramp:SEQ, fmt:pct},
  reachin:{f:(D,i)=>D.reachI[i], dom:[0,0.8], ramp:SEQ, fmt:pct},
  stock:{f:(D,i)=>tt(i,STHLM), time:true, fmt:tmin}
};
function indScale(){
  const I = IND[S.ind];
  if (I.time) return v => timeColor(v) || css("--land");
  if (I.log){ const s=d3.scaleSqrt().domain(d3.range(I.ramp.length).map(k=>I.dom[0]+(I.dom[1]-I.dom[0])*(k/(I.ramp.length-1))**2)).range(I.ramp).clamp(true); return v=> v>0 ? s(v) : css("--land"); }
  if (I.dom.length===2){ const s=d3.scaleLinear().domain(d3.range(I.ramp.length).map(k=>I.dom[0]+(I.dom[1]-I.dom[0])*k/(I.ramp.length-1))).range(I.ramp).clamp(true); return v => isFinite(v) ? s(v) : css("--land"); }
  const [lo,mid,hi]=I.dom, h=(I.ramp.length-1)/2;
  const tr = I.sym ? v=>Math.sign(v)*Math.log1p(Math.abs(v)/500) : v=>v;
  const L=tr(lo), H=tr(hi), M=tr(mid);
  const dom = I.ramp.map((_,k)=> k<=h ? L+(M-L)*k/h : M+(H-M)*(k-h)/h);
  const s = d3.scaleLinear().domain(dom).range(I.ramp).clamp(true);
  return v=>s(tr(v));
}

function fit(){

// ---------- drawing ----------
let R = null;
function flowPath(p1,p2){
  const [x1,y1]=p1,[x2,y2]=p2;
  if (S.shape==="straight") return `M${x1},${y1}L${x2},${y2}`;
  const dx=x2-x1, dy=y2-y1, mx=(x1+x2)/2 - dy*0.2, my=(y1+y2)/2 + dx*0.2;
  return `M${x1},${y1}Q${mx},${my} ${x2},${y2}`;
}
const timeOrigin = () => S.sel>=0 ? S.sel : STHLM;
function drawFill(){
  const D = Y(S.year), landC = css("--land");
  R = dus();
  gMesh.attr("display", S.mode==="dus" ? null : "none");
  if (S.mode==="dus"){
    for (let i=0;i<N;i++){ const r=R.region[i]; landByIdx[i].setAttribute("fill", R.size[r]>1 ? R.col.get(r) : landC); }
    gMesh.attr("d", path(topojson.mesh(topo,obj,(a,b)=>{ if (a===b) return true; const ra=R.region[meshIdx.get(a)], rb=R.region[meshIdx.get(b)]; return ra!==rb && (R.size[ra]>1 || R.size[rb]>1); })));
  } else if (S.mode==="ind"){ const sc=indScale(), I=IND[S.ind]; for (let i=0;i<N;i++) landByIdx[i].setAttribute("fill", sc(I.f(D,i))); }
  else if (S.mode==="time"){ const o=timeOrigin(); for (let i=0;i<N;i++){ const v = S.dir==="in" ? tt(i,o) : tt(o,i); landByIdx[i].setAttribute("fill", i===o ? css("--fg") : (timeColor(v)||landC)); } }
  else for (let i=0;i<N;i++) landByIdx[i].setAttribute("fill", landC);
  gTrack.attr("display", S.tracks ? null : "none"); gTies.attr("display", S.tracks ? null : "none");
  gLan.attr("display", S.lanb ? null : "none");
}
const meshIdx = new Map(obj.geometries.map((g,k)=>[g,fidx[k]]));
gLan.attr("d", path(topojson.mesh(topo,obj,(a,b)=> a!==b && P.lan[meshIdx.get(a)]!==P.lan[meshIdx.get(b)])));
function drawLinks(){
  gLinks.selectAll("line").remove();
  if (S.mode!=="dus" || !S.links || S.sel>=0) return;
  const L=[]; for (let i=0;i<N;i++){ const r=R.region[i]; if (r!==i) L.push([i,r]); }
  gLinks.selectAll("line").data(L).join("line").attr("class","rlink")
    .attr("x1",d=>A[d[0]][0]).attr("y1",d=>A[d[0]][1]).attr("x2",d=>A[d[1]][0]).attr("y2",d=>A[d[1]][1]);
}
function drawSegs(){
  if (S.mode!=="rail"){ gSeg.selectAll("path").remove(); return; }
  const cats = ["reg","long","fast"].filter(c=>S.rc[c]);
  const L = [];
  for (const s of SEGS){ let n=0, dom=null, dn=-1; for (const c of cats){ n+=s[c]; if (s[c]>dn){dn=s[c];dom=c;} } if (n>0) L.push({s,n,dom}); }
  L.sort((a,b)=>a.n-b.n);
  const col = {fast:css("--c-fast"), long:css("--c-long"), reg:css("--c-reg")};
  gSeg.selectAll("path").data(L).join("path").attr("class","seg-l")
    .attr("d",d=>`M${SA[d.s.a][0]},${SA[d.s.a][1]}L${SA[d.s.b][0]},${SA[d.s.b][1]}`)
    .attr("stroke",d=>col[d.dom]).attr("stroke-width",d=>Math.max(1, 0.55*S.wid*Math.sqrt(d.n))).attr("stroke-opacity",.85);
}
function fitColor(a,b){ const v=tt(a,b); return v===255 ? css("--c-none") : v<=S.fitm ? css("--hi") : css("--c-long"); }
function drawFlows(){
  const D = Y(S.year); let F=[];
  if (S.sel>=0 && S.mode!=="rail"){
    if (S.dir!=="in") for (const [j,v] of D.outL[S.sel]) if (v>=S.minf) F.push({a:S.sel,b:j,v,k:"out"});
    if (S.dir!=="out") for (const [i,v] of D.inL[S.sel]) if (v>=S.minf) F.push({a:i,b:S.sel,v,k:"in"});
  } else if (S.mode==="net" || S.mode==="fit"){
    const f=D.f; for (let k=0;k<f.length;k+=3) if (f[k+2]>=S.minf) F.push({a:f[k],b:f[k+1],v:f[k+2],k:"net"});
  }
  F.sort((x,y)=>x.v-y.v);
  const mx = S.sel>=0 ? 14 : 9, ref = S.sel>=0 ? Math.max(...F.map(d=>d.v),1) : 60000;
  const wS = v => Math.max(0.6, mx*S.wid*Math.sqrt(v/ref));
  const outC=css("--out"), inC=css("--in");
  const colr = d => S.mode==="fit" ? fitColor(d.a,d.b) : d.k==="in" ? inC : outC;
  gFlows.selectAll("path").data(F).join("path").attr("class","flow").attr("d",d=>flowPath(A[d.a],A[d.b]))
    .attr("stroke",colr).attr("stroke-width",d=>wS(d.v))
    .attr("stroke-opacity",d=> S.mode==="fit" ? 0.75 : d.k==="net" ? 0.45 : 0.8);
}
function drawBubbles(){
  const D = Y(S.year), arr = S.bub==="w"?D.w:D.j, k=curT.k||1;
  if (!S.bubOn || S.mode==="rail" || S.mode==="time"){ gBub.selectAll("circle").remove(); return; }
  const z = Math.sqrt(k/K0), base = 26*S.bsz*z/k, m = 600000;
  const idx = d3.range(N).sort((a,b)=>arr[b]-arr[a]);
  gBub.selectAll("circle").data(idx,d=>d).join("circle").attr("class","bub")
    .attr("cx",i=>A[i][0]).attr("cy",i=>A[i][1]).attr("r",i=>base*Math.sqrt(arr[i]/m))
    .attr("fill", css("--bubble"))
    .attr("fill-opacity", i=> S.sel>=0 ? (i===S.sel ? 0.55 : 0.15) : (S.mode==="net"||S.mode==="fit") ? 0.3 : 0.45);
}
function drawStations(){
  const show = S.mode==="rail" || S.mode==="time" || (S.sel>=0 && S.mode!=="dus");
  if (!show){ gStn.selectAll("circle").remove(); return; }
  const k=curT.k||1, z=Math.sqrt(k/K0);
  let idx = d3.range(ST.length).filter(i=>ST[i].k>=0 || (S.mode==="rail" && NEAR(i)));
  if (S.mode!=="rail") idx = idx.filter(i=>S.mode==="time" ? z>2.2 : ST[i].k===S.sel);
  idx.sort((a,b)=>ST[b].tot-ST[a].tot);
  gStn.selectAll("circle").data(idx,d=>d).join("circle").attr("class",i=>"stn"+(ST[i].k===S.sel&&S.sel>=0?" on":""))
    .attr("cx",i=>SA[i][0]).attr("cy",i=>SA[i][1]).attr("r",i=>(0.9+0.16*Math.sqrt(ST[i].tot))*S.bsz*Math.min(z,2.5)/k)
    .on("pointermove",(ev,i)=>hoverStation(ev,i)).on("pointerleave",()=>{tip.hidden=true})
    .on("click",(ev,i)=>{ ev.stopPropagation(); if (ST[i].k>=0) select(ST[i].k); });
}
function drawLabels(){
  const D = Y(S.year), k=curT.k||1, z=k/K0;
  let L, txt = i=>P.names[i], pos = i=>A[i];
  if (S.mode==="rail"){
    const order = d3.range(ST.length).filter(NEAR).sort((a,b)=>ST[b].tot-ST[a].tot);
    const seen = new Set(), n = Math.max(16,Math.min(Math.round(16*z*z),160));
    L = []; for (const i of order){ const key = z<3 ? (ST[i].k>=0 ? ST[i].k : ST[i].name) : i; if (seen.has(key)) continue; seen.add(key); L.push(i); if (L.length>=n) break; }
    txt = i=>ST[i].name; pos = i=>SA[i];
  } else {
    let cand = S.mode==="dus" ? d3.range(N).filter(i=>R.region[i]===i && R.size[i]>1) : d3.range(N);
    cand.sort((a,b)=>D.j[b]-D.j[a]);
    L = cand.slice(0, Math.max(6,Math.min(Math.round(10*z*z),120)));
    if (S.sel>=0 && !L.includes(S.sel)) L.unshift(S.sel);
    if (S.mode==="time"){ const o=timeOrigin(); txt = i=> i===o ? P.names[i] : `${P.names[i]} ${tmin(S.dir==="in"?tt(i,o):tt(o,i))}`; if (!L.includes(o)) L.unshift(o); }
  }
  const placed=[];
  L = L.filter(i=>{ const [x,y]=curT.apply(pos(i)); const w=txt(i).length*6.6+8; const box=[x-w/2,y-21,x+w/2,y-6];
    if (placed.some(b=>!(box[2]<b[0]||box[0]>b[2]||box[3]<b[1]||box[1]>b[3]))) return false; placed.push(box); return true; });
  gLbl.selectAll("text").data(L,d=>d).join("text").attr("class","lbl").attr("text-anchor","middle")
    .attr("x",i=>curT.apply(pos(i))[0]).attr("y",i=>curT.apply(pos(i))[1]-9).text(txt);
}
function drawSel(){ gSel.attr("d", S.sel>=0 ? path(feats[fidx.indexOf(S.sel)]) : null); }

const tip = $("tip"), wrap = $("wrap");
function place(ev,h){
  const r=wrap.getBoundingClientRect(); tip.innerHTML=h; tip.hidden=false;
  let x=ev.clientX-r.left+14, y=ev.clientY-r.top+14;
  if (x+280>r.width) x=ev.clientX-r.left-280; if (y+130>r.height) y=ev.clientY-r.top-130;
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
function hover(ev,i){
  const D=Y(S.year);
  let extra = "";
  if (S.mode==="ind") extra = `<br>${t("i_"+S.ind).replace(/ \(.*\)$/,"")}: <b>${IND[S.ind].fmt(IND[S.ind].f(D,i))}</b>`;
  if (S.mode==="dus" && R){ const rg=R.region[i]; if (rg!==i) extra = `<br>${t("member")}: <b>${P.names[rg]}</b>`; else if (R.size[i]>1) extra = `<br><b>${t("core")}</b> · ${R.size[i]} ${t("regsize")}`; }
  if (S.mode==="time"){ const o=timeOrigin(); const v=S.dir==="in"?tt(i,o):tt(o,i); extra = `<br>${t("tip_time")} ${S.dir==="in"?P.names[i]+" → "+P.names[o]:P.names[o]+" → "+P.names[i]}: <b>${tmin(v)}</b>`;
    const fl = (S.dir==="in"?D.outL[i]:D.outL[o]).find(([j])=> j===(S.dir==="in"?o:i)); if (fl) extra += `<br>${fmt(fl[1])} ${t("tip_pend")} ${D.f?"("+S.year+")":""}`; }
  if (kDep[i]) extra += `<br>${fmt(kDep[i])} ${t("tip_dep")}`;
  place(ev, `<b>${P.names[i]}</b><br>${fmt(D.w[i])} ${t("tip_w")} · ${fmt(D.j[i])} ${t("tip_j")}<br>${pct(D.s[i]/D.w[i])} ${t("tip_self")}${extra}`);
}
function hoverStation(ev,i){
  const s=ST[i];
  const parts = [["fast",0],["long",1],["reg",2]].filter(([c,k])=>s.dep[k]).map(([c,k])=>`${fmt(s.dep[k])} ${t("lg_"+c).toLowerCase()}`).join("<br>");
  place(ev, `<b>${s.name}</b>${s.k>=0?" · "+P.names[s.k]:""}<br><b>${fmt(s.tot)}</b> ${t("tip_dep")} · ${fmt(s.peak)} ${t("tip_peak")}<br>${parts}<br><span style="font-size:var(--fs-xs)">${s.ops.join(", ")}</span>`);
}

function scatter(D){
  const box=$("scat"), W=Math.max(320, box.clientWidth||900), H=380, m={l:56,r:16,t:10,b:42};
  const pts=[]; const f=D.f;

    pts.push({a,b,v,tv,dir:direct(a,b)>0}); }

  const xn = m.l+xw-nonew/2;

  const jit = i => ((i*9301+49297)%233280)/233280-0.5;
  pts.forEach((p,i)=>{ p.x = p.tv===255 ? xn + jit(i)*nonew*0.8 : x(Math.min(p.tv,180)); p.y=y(p.v); });
  pts.sort((p,q)=>p.v-q.v);
  const col = p => p.tv===255 ? "var(--c-none)" : p.dir ? "var(--c-fast)" : "var(--c-reg)";
  const yt = [200,500,1000,2000,5000,10000,20000,50000].filter(v=>v<=y.domain()[1]);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("p1")}">`;
  s += `<g class="grid">${yt.map(v=>`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}"/>`).join("")}${[30,60,90,120,150,180].map(v=>`<line x1="${x(v)}" x2="${x(v)}" y1="${m.t}" y2="${H-m.b}"/>`).join("")}</g>`;
  s += `<rect x="${x(0)}" y="${m.t}" width="${x(60)-x(0)}" height="${H-m.b-m.t}" fill="var(--hi)" fill-opacity=".09"/>`;
  s += `<g class="axis">${yt.map(v=>`<text x="${m.l-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`).join("")}${[0,30,60,90,120,150,180].map(v=>`<text x="${x(v)}" y="${H-m.b+16}" text-anchor="middle">${v}</text>`).join("")}<text x="${xn}" y="${H-m.b+16}" text-anchor="middle">${t("p1n")}</text>
   <text x="${(m.l+x(180))/2}" y="${H-6}" text-anchor="middle">${t("p1x")}</text><text transform="translate(12,${(H-m.b+m.t)/2}) rotate(-90)" text-anchor="middle">${t("p1y")}</text>
   <line x1="${xn-nonew/2-4}" x2="${xn-nonew/2-4}" y1="${m.t}" y2="${H-m.b}" stroke="var(--fg)"/></g>`;
  s += pts.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(2+Math.sqrt(p.v)/40).toFixed(1)}" fill="${col(p)}" fill-opacity=".72" stroke="var(--panel)" stroke-width=".6"/>`).join("");
  const big = [], boxes = [];
  for (const p of pts.slice().reverse()){ if (big.length>=10 || p.v<3000) break;
    const lab = `${P.names[p.a]} → ${P.names[p.b]}`, w = lab.length*6.2, b=[p.x+7, p.y-9, p.x+7+w, p.y+5];
    if (b[2] > W-m.r) continue;
    if (boxes.some(q=>!(b[2]<q[0]||b[0]>q[2]||b[3]<q[1]||b[1]>q[3]))) continue; boxes.push(b); big.push(p); }
  s += big.map(p=>`<text class="nl" x="${p.x+7}" y="${p.y+4}" style="paint-order:stroke;stroke:var(--panel);stroke-width:3px">${P.names[p.a]} → ${P.names[p.b]}</text>`).join("");
  s += `<circle id="sc-h" r="0" fill="none" stroke="var(--fg)" stroke-width="1.5"/></svg>`;
  box.innerHTML = s;
  const sv = box.querySelector("svg"), del = d3.Delaunay.from(pts,p=>p.x,p=>p.y), hc = sv.querySelector("#sc-h");
  const pick = ev => { const r=sv.getBoundingClientRect(), sx=(ev.clientX-r.left)*W/r.width, sy=(ev.clientY-r.top)*H/r.height; const i=del.find(sx,sy); const p=pts[i]; return Math.hypot(p.x-sx,p.y-sy)<24 ? p : null; };
  sv.onpointermove = ev => { const p=pick(ev); if (!p){ tip.hidden=true; hc.setAttribute("r",0); return; }
    hc.setAttribute("cx",p.x); hc.setAttribute("cy",p.y); hc.setAttribute("r",2+Math.sqrt(p.v)/40+3);
    place(ev, `<b>${P.names[p.a]} → ${P.names[p.b]}</b><br>${fmt(p.v)} ${t("tip_all")} (${S.year})<br>${t("tip_conn")}: <b>${tmin(p.tv)}</b><br>${t("th_d")}: ${fmt(direct(p.a,p.b))}`); };
  sv.onpointerleave = ()=>{ tip.hidden=true; hc.setAttribute("r",0); };
  sv.onclick = ev => { const p=pick(ev); if (p){ tip.hidden=true; openKommun(p.a); } };
  sv.style.cursor="pointer";
}
function gapTable(D){

function hbars(elId, rows, opts={}){

$("year").oninput=()=>setYear(+$("year").value);
$("play").onclick=()=>{
  if (S.playing){ clearInterval(S.playing); S.playing=null; $("play").textContent="▶"; $("play").setAttribute("aria-label",t("play")); return; }
  if (S.year>=2024) setYear(2004);
  $("play").textContent="❚❚"; $("play").setAttribute("aria-label",t("pause"));
  S.playing=setInterval(()=>{ if (S.year>=2024){ $("play").click(); return; } setYear(S.year+1); }, 750);
};
function breakNote(){ $("breaknote").textContent = S.year===2019 ? t("brk2019") : S.year===2020 ? t("brk2020") : t("brkall"); }
$("search").onchange=()=>{ const v=$("search").value.trim().toLowerCase(); const i=P.names.findIndex(n=>n.toLowerCase()===v); if (i>=0){ setView("map"); select(i); $("search").value=""; zoomTo(i); } };
function zoomTo(i){ const r=svg.node().getBoundingClientRect(); const k=Math.max(curT.k, K0*3); svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(r.width/2-k*A[i][0], r.height/2-k*A[i][1]).scale(k)); }
document.addEventListener("keydown",e=>{
  if (e.target.matches("input,select")) return;
  if (e.key==="Escape"){ if (!$("about").hidden) $("about").hidden=true; else if (!$("dash").hidden) setView("map"); else select(-1); }
  if (S.sel>=0 && $("dash").hidden && (e.key==="ArrowRight"||e.key==="ArrowLeft")){
    const order=d3.range(N).sort((a,b)=>P.names[a].localeCompare(P.names[b],"sv")); const p=order.indexOf(S.sel);
    select(order[(p+(e.key==="ArrowRight"?1:-1)+N)%N]);
  }
});
$("about-btn").onclick=()=>{ $("about").hidden=false; $("about").scrollTop=0; drawContour($("contour"),0.62,0.5); };
$("lead-more").onclick=()=>{ $("about").hidden=false; drawContour($("contour"),0.62,0.5); const h=$("om-vad"); if (h) h.scrollIntoView({block:"start"}); };
function drawContour(cv, cxf, cyf){
  if (!cv) return; const r = cv.getBoundingClientRect(); if (!r.width) return;
  const d = window.devicePixelRatio || 1; cv.width = r.width*d; cv.height = r.height*d;
  const x = cv.getContext("2d"); x.setTransform(d,0,0,d,0,0); x.clearRect(0,0,r.width,r.height);
  x.strokeStyle = css("--contour");
  const w=r.width, h=r.height, cx=w*cxf, cy=h*cyf;
  for (let i=1;i<=14;i++){
    const b = i*Math.max(w,400)*0.028; x.lineWidth = i%5===0 ? 1.4 : 1; x.beginPath();
    for (let st=0; st<=180; st++){
      const a = st/180*Math.PI*2;
      const k = 1+0.17*Math.sin(3*a+i*0.32)+0.08*Math.sin(5*a+1.3-i*0.1)+0.05*Math.sin(8*a-i*0.21);
      const px = cx+Math.cos(a)*b*k*1.25, py = cy+Math.sin(a)*b*k*0.85;
      st ? x.lineTo(px,py) : x.moveTo(px,py);
    }
    x.closePath(); x.stroke();
  }
}

// ---------- language ----------
function applyLang(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll("[data-th]").forEach(el=>el.innerHTML=t(el.dataset.th)); document.documentElement.lang=S.lang;
  $("lang-sv").setAttribute("aria-pressed",S.lang==="sv"); $("lang-en").setAttribute("aria-pressed",S.lang==="en");
  $("search").placeholder=t("search");
  $("ind").innerHTML = Object.keys(IND).map(k=>`<option value="${k}"${k===S.ind?" selected":""}>${t("i_"+k)}</option>`).join("");
  $("about-in").innerHTML = ABOUT[S.lang]; $("about-close").onclick=()=>{$("about").hidden=true;}; if (!$("about").hidden) drawContour($("contour"),0.62,0.5);
  $("play").setAttribute("aria-label", t(S.playing?"pause":"play"));
  $("thr-o").textContent=$("thr").value+" %";
  $("wid-o").textContent=S.wid.toLocaleString(loc(),{minimumFractionDigits:1})+"×";
  $("bsz-o").textContent=S.bsz.toLocaleString(loc(),{minimumFractionDigits:1})+"×";
  setMinf(); breakNote(); draw();
}
["sv","en"].forEach(l=>$("lang-"+l).onclick=()=>{ S.lang=l; try{localStorage.setItem("pendla-lang",l);}catch(e){} applyLang(); });
$("komlist").innerHTML = P.names.map(n=>`<option value="${n}">`).sort().join("");
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>draw());
new MutationObserver(()=>draw()).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
let rz; new ResizeObserver(()=>{ fit(); clearTimeout(rz); rz=setTimeout(()=>{ if (!$("dash").hidden) dashboard(); },200); }).observe(svg.node());
applyLang();
fit();
})();
</script>
